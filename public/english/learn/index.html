<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>İngilis Danışıq — Giriş</title>
<style>
:root{--bg:#F4F7F6;--card:#FFF;--ink:#15302B;--muted:#5C706C;--acc:#0E7C6B;--acc2:#E1EFEC;--bd:#DBE4E1;--err:#B8443A}
@media(prefers-color-scheme:dark){:root{--bg:#0E1716;--card:#16211F;--ink:#E6EEEB;--muted:#93A5A0;--acc:#3FBFA8;--acc2:#1A2D29;--bd:#25352F;--err:#E27A6E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;padding:20px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 26px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:1.15rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{font-size:.82rem;color:var(--muted);margin:0 0 20px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
input[type=text],input[type=password]{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem;font-family:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.rem{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:.85rem;color:var(--muted)}
.rem input{accent-color:var(--acc);width:16px;height:16px}
button{width:100%;margin-top:18px;padding:12px;border:none;border-radius:10px;background:var(--acc);color:var(--bg);font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer}
button:active{transform:scale(.98)}
button:disabled{opacity:.6}
.err{display:none;margin-top:12px;font-size:.83rem;color:var(--err);font-weight:600}
.mic{width:38px;height:38px;border-radius:11px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.15rem;margin-bottom:14px}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="mic">🗣️</div>
  <h1>İngilis danışıq məşqi</h1>
  <p class="sub">Bu səhifə şəxsidir. Davam etmək üçün daxil ol.</p>
  <label for="u">İstifadəçi adı</label>
  <input type="text" id="u" autocomplete="username" autocapitalize="none" required>
  <label for="p">Parol</label>
  <input type="password" id="p" autocomplete="current-password" required>
  <div class="rem"><input type="checkbox" id="r" checked><label for="r" style="display:inline;margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:500">Bu cihazda yadda saxla</label></div>
  <button type="submit" id="go">Daxil ol</button>
  <div class="err" id="e">İstifadəçi adı və ya parol səhvdir.</div>
</form>

const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(user,pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(user.toLowerCase().trim()+":"+pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(CT));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
(async()=>{
  try{const j=localStorage.getItem(RKEY);
    if(j){const key=await crypto.subtle.importKey("jwk",JSON.parse(j),{name:"AES-GCM"},true,["decrypt"]);await open(key);}
  }catch(e){try{localStorage.removeItem(RKEY)}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("go"),err=document.getElementById("e");
  btn.disabled=true;btn.textContent="Yoxlanır…";err.style.display="none";
  try{
    const key=await deriveKey(document.getElementById("u").value,document.getElementById("p").value);
    if(document.getElementById("r").checked){
      try{localStorage.setItem(RKEY,JSON.stringify(await crypto.subtle.exportKey("jwk",key)))}catch(_){}
    }
    await open(key);
  }catch(e){
    try{localStorage.removeItem(RKEY)}catch(_){}
    err.style.display="block";btn.disabled=false;btn.textContent="Daxil ol";
  }
});
